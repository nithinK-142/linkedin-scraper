[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkedin-archiver"
version = "1.0.0"
description = "CLI archiver for LinkedIn saved posts using an authenticated Chromium profile"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45,<2",
  "psutil>=5.9",
  "typer>=0.16,<1",
]

[project.scripts]
linkedin-archiver = "linkedin_archiver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
